server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: auth
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
      client:
        simple:
          instances:
            user-service[0]:
              uri: ${wiremock.url}

token:
  expire: 24
  signing:
    key: test-only-key-not-used-by-mocked-tests

eureka:
  client:
    enabled: false

test:
  id: 0
  username: test
  password: test
  encrypted-password: $2y$10$Q7T5uXHm1z44bUqan0rtruPSs2Zj0XUZF3/SotMth3q.9nkJCbnnW
  jwt: REPLACE_WITH_JWT_TOKEN

response:
  user-found:
    filename: user_found.json
  user-not-found:
    filename: user_not_found.json
